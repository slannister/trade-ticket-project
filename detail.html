<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>刊登詳情</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>

<body class="detail-page" data-theme="dark">
  <header class="detail-topbar">
    <a class="detail-back" href="index.html">← 返回列表</a>
    <button id="theme-toggle" class="ghost-button theme-toggle" type="button" aria-label="切換為亮色模式"></button>
  </header>
  <main class="detail-shell" data-detail-root>
    <section class="detail-card">
      <div class="detail-media" data-media>
        <div class="detail-media-slider" data-media-slider hidden>
          <div class="detail-media-track" data-media-track></div>
        </div>
        <span class="detail-media-fallback" data-media-initial>票</span>
        <button class="detail-media-nav detail-media-nav-prev" type="button" aria-label="上一張" data-media-prev
          hidden>‹</button>
        <button class="detail-media-nav detail-media-nav-next" type="button" aria-label="下一張" data-media-next
          hidden>›</button>
        <button class="detail-media-view" type="button" data-media-view hidden>查看大圖</button>
      </div>
      <div class="detail-content">
        <div class="detail-header">
          <h1 data-title>刊登標題</h1>
          <div class="detail-tags" data-tags></div>
        </div>
        <p class="detail-description" data-description></p>
        <dl class="detail-info">
          <div>
            <dt>刊登類型</dt>
            <dd data-type>—</dd>
          </div>
          <div>
            <dt>類別</dt>
            <dd data-category>—</dd>
          </div>
          <div>
            <dt>數量</dt>
            <dd data-quantity>—</dd>
          </div>
          <div>
            <dt>交付方式</dt>
            <dd data-delivery>—</dd>
          </div>
          <div>
            <dt>交易地點</dt>
            <dd data-location>—</dd>
          </div>
          <div>
            <dt>截止時間</dt>
            <dd data-expires>—</dd>
          </div>
          <div>
            <dt>價格</dt>
            <dd data-price>—</dd>
          </div>
          <div>
            <dt>發佈時間</dt>
            <dd data-created>—</dd>
          </div>
        </dl>
        <div class="detail-contact">
          <p data-contact>—</p>
        </div>
      </div>
    </section>
    <!-- <section class="detail-gallery" data-gallery hidden>
        <h2>圖片</h2>
        <div class="detail-gallery-grid" data-gallery-grid></div>
      </section> -->
    <section class="detail-empty" data-empty hidden>
      <p>目前無任何刊登資訊。請返回列表重新選擇。</p>
      <a class="detail-back detail-empty-back" href="index.html">返回列表</a>
    </section>
  </main>
  <div aria-hidden="true" class="image-modal" id="image-modal">
    <div class="image-modal-backdrop"></div>
    <div aria-label="圖片預覽" aria-modal="true" class="image-modal-content" role="dialog">
      <button aria-label="關閉" class="image-modal-close" type="button">×</button>
      <img alt="刊登圖片預覽" class="image-modal-image" />
      <div class="image-modal-controls">
        <button aria-label="上一張" class="image-modal-nav image-modal-prev" type="button">‹</button>
        <span class="image-modal-counter"></span>
        <button aria-label="下一張" class="image-modal-nav image-modal-next" type="button">›</button>
      </div>
    </div>
  </div>
  </div>
  <div aria-hidden="true" class="inquiry-modal" id="inquiry-modal">
    <div class="inquiry-modal-backdrop"></div>
    <div aria-label="詢問表單" aria-modal="true" class="inquiry-modal-content" role="dialog">
      <button aria-label="關閉" class="inquiry-modal-close" type="button">×</button>
      <h2 class="inquiry-modal-title">詢問賣家</h2>
      <form id="inquiry-form" class="inquiry-form">
        <div class="field">
          <label for="inquiry-message">您的訊息</label>
          <textarea id="inquiry-message" name="message" placeholder="你好，我對這張票有興趣..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">送出</button>
        </div>
      </form>
    </div>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <script src="config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    let supabaseClient = null;

    if (
      window.supabaseConfig &&
      window.supabaseConfig.url &&
      window.supabaseConfig.url.startsWith('http') &&
      window.supabaseConfig.anonKey &&
      !window.supabaseConfig.anonKey.startsWith('YOUR_SUPABASE')
    ) {
      supabaseClient = createClient(window.supabaseConfig.url, window.supabaseConfig.anonKey);
    } else {
      console.warn('Supabase config is not set. The detail page 無法載入遠端資料。');
    }

    window.__supabase = supabaseClient;
  </script>
  <script src="./assets/theme.js" type="module"></script>
  <script src="./assets/detail.js" type="module"></script>
</body>

</html>
