<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 - TikSwap</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="detail-page" data-theme="dark">
  <header class="detail-topbar">
    <a class="detail-back" href="/">← 返回列表</a>
    <button id="theme-toggle" class="ghost-button theme-toggle" type="button" aria-label="切換為亮色模式"></button>
  </header>
  <main class="detail-shell">
    <section class="detail-card">
      <div class="detail-content">
        <div class="detail-header">
          <h1>重設密碼</h1>
        </div>
        <div id="reset-form-container">
          <form id="reset-password-form">
            <div class="field">
              <label for="new-password">新密碼</label>
              <input type="password" id="new-password" name="new_password" placeholder="至少 6 碼" required />
            </div>
            <div class="field">
              <label for="confirm-password">確認密碼</label>
              <input type="password" id="confirm-password" name="confirm_password" placeholder="再次輸入新密碼" required />
            </div>
            <div id="reset-error" class="member-message member-message-error" hidden></div>
            <div id="reset-success" class="member-message member-message-success" hidden></div>
            <div class="form-actions">
              <button type="submit" class="primary">重設密碼</button>
            </div>
          </form>
        </div>
        <div id="reset-success-container" hidden>
          <p>密碼已成功重設！</p>
          <a href="/" class="primary">返回首頁</a>
        </div>
      </div>
    </section>
  </main>
  <div id="toast-root" class="toast-root"></div>
  <script type="module">
    const form = document.getElementById('reset-password-form');
    const errorEl = document.getElementById('reset-error');
    const successEl = document.getElementById('reset-success');
    const successContainer = document.getElementById('reset-success-container');
    const formContainer = document.getElementById('reset-form-container');

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      errorEl.textContent = '無效的重設連結';
      errorEl.hidden = false;
      formContainer.hidden = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      errorEl.hidden = true;
      successEl.hidden = true;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = '兩次輸入的密碼不一致';
        errorEl.hidden = false;
        return;
      }

      if (newPassword.length < 6) {
        errorEl.textContent = '密碼至少需要 6 碼';
        errorEl.hidden = false;
        return;
      }

      try {
        const response = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.error || '重設失敗';
          errorEl.hidden = false;
          return;
        }

        formContainer.hidden = true;
        successContainer.hidden = false;
      } catch (err) {
        errorEl.textContent = '發生錯誤，請稍後再試';
        errorEl.hidden = false;
      }
    });

    const toggle = document.getElementById('theme-toggle');
    if (toggle) {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.body.setAttribute('data-theme', savedTheme);
      toggle.addEventListener('click', () => {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }
  </script>
</body>
</html>
